# Started with this directory as the nginx -p prefix by scripts/frontend-nginx.ps1.
worker_processes 1;
pid logs/campus-nginx.pid;
error_log logs/error.log warn;
events { worker_connections 1024; }
http {
    include runtime-mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    access_log logs/access.log;
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 127.0.0.1:8088;
        server_name localhost;
        root ../../frontend/dist;
        index index.html;
        # Spring allows a 2 MB avatar plus multipart overhead.
        client_max_body_size 3m;

        location = /api { return 308 /api/; }
        location ^~ /api/ {
            # No trailing slash: retain /api in the upstream request URI.
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_cache off;
            proxy_intercept_errors off;
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ /\. { deny all; }
        location / {
            # Direct visits and refreshes of /publisher, /student and /admin.
            try_files $uri $uri/ /index.html;
        }
    }
}
